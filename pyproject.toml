[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
license = {text = "Apache-2.0"}
readme = "README.md"
name = "densescout"
version = "0.1.0a1"
description = "DenseScout budgeted patch-center selector"
requires-python = ">=3.9"
dependencies = ["torch", "torchvision", "timm", "numpy", "opencv-python-headless", "Pillow", "PyYAML"]

[tool.setuptools]
packages = ["densescout"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/zhouer-bear/DenseScout"
Repository = "https://github.com/zhouer-bear/DenseScout"
Issues = "https://github.com/zhouer-bear/DenseScout/issues"
Paper = "https://doi.org/10.1145/3767308.3836001"
